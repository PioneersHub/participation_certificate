# BASIC CONFIGURATION, DO NOT ALTER
# Put your configuration in `config.local.yaml`
# ########################################
# METADATA
# ########################################
# short name of the event, also used in output paths
event_short_name: ""
# full name of the event, used in content
event_full_name: ""
# url to download certificates
certificates_url: ""
# local path to write static validation pages (for static site generators like Lektor)
static_pages_website: ""
# public URL for validation links in PDFs (optional, defaults to static_pages_website if not set)
validation_url: ""
# Attendee data file, relative to dirs.data_dir. CSV (.csv) or Excel (.xlsx).
attendees_table: ""
# Process only the first N attendees (useful for testing). 0 = process all.
batch_size: 0
# ########################################
# DIRECTORIES
# ########################################
# Each directory is relative to the root of the project and will be created if
# it does not exist
dirs:
  # Default directory to store PDF certificates, excluded via .gitignore
  path_to_certificates: "./_certificates"
  # Directory for cryptographic keys, certificates to sign PDF
  path_to_signatures: "./_signatures"
  # Directory for local fonts like. Add fonts in by font family name:
  # fonts/<font family name>, excluded via .gitignore
  fonts_dir: "./fonts"
  # Directory for local data, excluded via .gitignore
  data_dir: "./_data"
  # local path to graphic files
  graphics: "./graphics"
# ########################################
# FONTS
# ########################################
# Font configuration for PDF generation
fonts:
  # Automatically load all TTF fonts from fonts directory
  auto_load_ttf: true
  # Default font to use if not specified
  default_font: "helvetica"
  default_size: 12
  # Specific font definitions (optional)
  # Format: font_name: {file: "path/to/font.ttf", styles: {bold: "path/to/font-bold.ttf", italic: "path/to/font-italic.ttf"}}
  custom_fonts:
  # Example:
  # poppins:
  #   regular: "Poppins/Poppins-Regular.ttf"
  #   bold: "Poppins/Poppins-Bold.ttf"
  #   italic: "Poppins/Poppins-Italic.ttf"
  # Initial font setting when creating PDFs
  initial_font:
    name: "helvetica"
    size: 12
    style: ""  # "", "B", "I", or "BI"
# Legacy settings (deprecated, use fonts section above)
default_font: "Helvetica"
additional_fonts:  # located in ./fonts
# - "Roboto"
# ########################################
# LAYOUT
# ########################################
# It's important to know the dimensions of your page to place items correctly.
# DIN A4 pages in landscape orientation have
# a width of 297mm and a height of 210mm = 841.89 x 595.28 points.
layout:
  default:
    background:
      color:
        - 0
        - 0
        - 0  # black
    font:
      size: 12
      name: "helvetica"
      style: ""
      color:
        - 0
        - 0
        - 0  # black
    width: 200
  # PDF Background Configuration (optional)
  # Use a prepared PDF as background template instead of colored rectangles
  # When enabled, the background rectangles below will be ignored
  pdf_background:
    enabled: false  # Set to true to use a PDF as background
    file: ""  # Filename relative to graphics directory (e.g., "certificate_template.pdf")
    page: 1  # Which page number to use from multipage PDFs (1-based index)
  background:
    # Items are place on top of each other.
    # Add a sequence of items to be placed on the canvas.
    # Currently only rectangles are supported.
    # Rectangle as the background, will look like a frame.
    - color:
        - 61
        - 164
        - 51  # some green
      width: 0 # full width
      height: 0 # full height
      position:
        - 0
        - 0
  text_items:
    # text: "str"
    # position: tuple(x, y)
    # font:
    # name: "str valid font name (optional, fallbacks to default)"
    # size: number (optional, fallbacks to default)
    # style: B, I, BI  (optional, fallbacks to "")
    - text: "This is a Title"
      position:
        - 45
        - 98
      font:
        name: "helvetica"
        size: 48
        style: ""
    - text: "Format text: {attendee.full_name}"
      position:
      - 50
      - 180
      font:
        name: "helvetica"
        size: 24
    - text: "No. {attendee.hash}"
      position:
        - 532
        - 128
      font:
        name: "helvetica"
        size: 24
    - text:
        - multi-lime bold **{event_full_name}**
        - text with format.
      position:
        - 45
        - 200
      width: 600
      font:
        size: 16
  graphics:
    - name: "24-snake.svg"
      position:
        - 400
        - 160
      width: 440
    - name: "PyConDE.svg"
      position:
        - 125
        - 500
      width: 40
      link: https://pycon.de
metadata:
  description: "Add text here."
  title: "Title"
  author: "Author"
  keywords: "A, B, C"
# ########################################
# EMAIL CONFIGURATION
# ########################################
email:
  # Email provider to use: "helpdesk" or "brevo"
  provider: "helpdesk"

  # HelpDesk provider configuration
  helpdesk:
    team_id: ""
    agent_id: ""  # Optional, will use account default if not provided
    throttle_requests: 1
    throttle_period: 10

  # Brevo provider configuration
  brevo:
    # API key or path to file containing API key
    api_key: ""  # Or use api_key_path below
    api_key_path: "_secret/brevo_key"  # Relative to project root
    sender_name: "Your Event Name"
    sender_email: "noreply@example.com"
# ########################################
